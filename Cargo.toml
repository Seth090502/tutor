[workspace]
resolver = "3"
members = ["crates/*"]
# Phase 0 measurement tools are standalone packages with their own lockfiles.
exclude = ["bench/vector-bench", "bench/model-bench", "tools/iobench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
vault-api = { path = "crates/vault-api" }
async-trait = "=0.1.92"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "=2.0.21"
