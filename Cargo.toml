[workspace]
resolver = "3"
members = ["crates/*"]
# Phase 0 measurement tools are standalone packages with their own lockfiles.
exclude = ["bench/vector-bench", "bench/model-bench", "tools/iobench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
# Internal crates.
vault-api = { path = "crates/vault-api" }
vault-client = { path = "crates/vault-client" }
vault-core = { path = "crates/vault-core" }
vault-extract = { path = "crates/vault-extract" }
# External crates: exact pins only (docs/phase1/SPEC.md section 1). Crates choose their own features.
async-trait = "=0.1.92"
axum = "=0.8.9"
blake3 = "=1.8.7"
chardetng = "=1.0.0"
clap = "=4.6.7"
deunicode = "=1.6.2"
ego-tree = "=0.11.0"
encoding_rs = "=0.8.42"
flate2 = "=1.1.10"
fs4 = "=1.1.0"
futures = "=0.3.34"
pdfium-render = { version = "=0.9.4", default-features = false }
prost = "=0.14.4"
proptest = "=1.11.0"
protox = "=0.9.1"
rand = "=0.10.3"
rayon = "=1.12.0"
regex = "=1.13.1"
rmcp = { version = "=3.5.0", default-features = false }
roxmltree = "=0.21.1"
rusqlite = "=0.40.2"
schemars = "=1.2.2"
scraper = "=0.27.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
subtle = "=2.6.1"
tar = "=0.4.46"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = "=1.53.1"
tokio-stream = "=0.1.19"
tokio-util = "=0.7.19"
toml = "=1.1.6"
tonic = { version = "=0.14.6", default-features = false }
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
tower = "=0.5.3"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.13.3"
zip = { version = "=8.6.0", default-features = false }
