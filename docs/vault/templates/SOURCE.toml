# Optional: put this file at the root of a repository you deliver, to record what the vault cannot read from
# the files themselves. Every field is optional. See INSTRUCTIONS.md section 4.

name = "example-repo"
url = "https://github.com/owner/example-repo"
commit = ""                      # owner-supplied verified commit, or unknown; file hashes bind delivered bytes
license = "MIT"                  # SPDX id, or "owned" / "unknown"; LICENSE files are detected anyway
categories = ["cs-ai"]           # first one is primary; e.g. ["cs-ai", "psych-cogsci"] for a PsychoPy experiment
collections = ["gamedev"]         # named sets agents can scope to, e.g. gamedev, compilers, rust-exemplars
level = "graduate"               # intro | graduate | landmark | recent
description = "One line on what this code is and why it is in the vault."
companion = ""                   # optional: DOI or title of the book or paper this code accompanies
profile = ""                     # only if detection gets it wrong: unreal | source-engine | godot | generic
