[package]
name = "model-bench"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone package: do not join any parent workspace.
[workspace]

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ureq = { version = "=3.4.2", default-features = false, features = ["json"] }
