[package]
name = "libraryd"
description = "The vault server: MCP and gRPC over the VaultApi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# MockVault: a VaultApi over fixture data, for tests and `libraryd --mock`.
default = ["mock"]
mock = ["dep:regex"]

[dependencies]
vault-api = { workspace = true, features = ["schema"] }
vault-client = { path = "../vault-client", features = ["server"] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
tonic = { version = "=0.14.6", default-features = false, features = ["transport", "codegen", "router", "gzip", "zstd"] }
axum = { version = "=0.8.9", features = ["http2"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tokio-util = "=0.7.19"
futures = "=0.3.34"
subtle = "=2.6.1"
rand = "=0.10.3"
toml = "=1.1.6"
tracing = "0.1"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
regex = { version = "=1.13.1", optional = true }
clap = { version = "=4.6.7", features = ["derive"] }

[dev-dependencies]
tower = "=0.5.3"
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
