[package]
name = "vault-extract"
description = "Format detection and converters from delivered files to canonical-ready Markdown with structure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["pdfium"]
# PDF text with page labels and reading order through PDFium, bound at run time (no DLL is needed to build).
pdfium = ["dep:pdfium-render"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = "=0.1.44"
roxmltree = "=0.21.1"
scraper = "=0.27.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = "=0.4.46"
flate2 = "=1.1.10"
encoding_rs = "=0.8.42"
chardetng = "=1.0.0"
regex = "=1.13.1"
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"], optional = true }

[dev-dependencies]
