# Phase 1 extraction spike. Standalone (own workspace and lockfile); not part of the vault workspace.
[package]
name = "extract-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
xberg = { version = "=1.3.0", default-features = false, features = ["pdf", "office", "html", "xml", "archives", "tokio-runtime"] }
pdfium-render = "=0.9.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
