[package]
name = "rag-engine"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
# Runtime-bound PDFium only: no image rendering, and PDFs are processed on one thread.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest"] }
rayon = "1.12.0"
# Reading only: the EPUB writer is not needed.
rbook = { version = "0.7.10", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
walkdir = "2.5.0"
axum = "0.8.9"
futures = "0.3"
lancedb = { version = "0.37.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tantivy = "0.26.2"
text-splitter = { version = "0.33.0", features = ["markdown", "tiktoken-rs"] }
tiktoken-rs = "0.12.1"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["cors"] }
