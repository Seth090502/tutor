[package]
name = "vault-client"
description = "Rust gRPC client for libraryd, and the protobuf contract it shares with the server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# Also generate the tonic server stubs (libraryd turns this on; clients do not need them).
server = ["tonic/router"]

[dependencies]
vault-api.workspace = true
async-trait.workspace = true
thiserror.workspace = true
prost = "=0.14.4"
tonic = { version = "=0.14.6", default-features = false, features = ["transport", "codegen", "gzip", "zstd"] }
tonic-prost = "=0.14.6"
tokio = { version = "1.53.1", features = ["time", "macros"] }
futures = "=0.3.34"
tracing = "0.1"

[build-dependencies]
protox = "=0.9.1"
tonic-prost-build = "=0.14.6"

[dev-dependencies]
proptest = "=1.11.0"
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["full"] }
