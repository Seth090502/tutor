[package]
name = "vault-api"
description = "The vault's tool contract: addresses, request and response types, and the VaultApi trait shared by libraryd, vault-core and vault-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
schemars = { version = "=1.2.2", optional = true }

[features]
# JSON Schema for the request and response types; libraryd turns it on to publish MCP tool schemas.
schema = ["dep:schemars"]

[dev-dependencies]
serde_json.workspace = true
