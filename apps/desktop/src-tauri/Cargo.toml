[package]
name = "desktop"
version = "0.1.0"
description = "Tutor desktop app (Tauri shell)"
authors = ["Seth"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: saved learner folds (contract C13) resume bit-exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Learner projections and study plan (contract C13), and the time zones they take.
learning-core = { path = "../../../crates/learning-core" }
chrono-tz = { version = "0.10.4", default-features = false }
# Windows Credential Manager (keyring 4's v1 API selects windows-native-keyring-store on Windows).
keyring = "4.2"
# HTTPS with rustls on the ring provider (installed in `http_client`): ring is Apache-2.0 AND ISC
# and far lighter to build than the default aws-lc-rs.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["time"] }
# Dual N-Back sessions (contract C6); same version as crates/rag-engine, SQLite compiled in.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Text-to-speech cache file names (contract C10); already in the lockfile through Tauri.
sha2 = "0.11"
# The shell is Windows-only: Job Objects keep sidecar process trees tied to the app.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
