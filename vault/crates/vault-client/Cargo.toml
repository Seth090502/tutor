[package]
name = "vault-client"
description = "Rust gRPC client for libraryd, and the protobuf contract it shares with the server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# Also generate the tonic server stubs (libraryd turns this on; clients do not need them).
server = ["tonic/router"]

[dependencies]
vault-api.workspace = true
async-trait.workspace = true
thiserror.workspace = true
prost.workspace = true
tonic = { workspace = true, features = ["transport", "codegen", "gzip", "zstd"] }
tonic-prost.workspace = true
tokio = { workspace = true, features = ["time", "macros"] }
futures.workspace = true
tracing.workspace = true

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
