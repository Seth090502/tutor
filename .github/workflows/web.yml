name: Web

# Upstream DeepTutor's Next.js web UI: the deterministic frontend gate, then interaction, accessibility and
# visual audits in Playwright against a production build.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend gate and browser audits
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Deterministic frontend gate
        run: npm run check
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Interaction, accessibility and visual audits
        run: |
          npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/web-audit.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for _ in $(seq 1 100); do
            curl --fail --silent http://127.0.0.1:3000/ > /dev/null && break
            if ! kill -0 "$server" 2>/dev/null; then cat /tmp/web-audit.log; exit 1; fi
            sleep 0.1
          done
          WEB_BASE_URL=http://127.0.0.1:3000 npm run audit
