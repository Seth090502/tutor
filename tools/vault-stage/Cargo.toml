[package]
name = "vault-stage"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

# An isolated tool: never acquires the live vault workspace's build locks.
[workspace]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
# Optional loopback evaluator binary; the staging engine does not use HTTP.
ureq = { version = "=3.4.2", default-features = false, features = ["json"] }
